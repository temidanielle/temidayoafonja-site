<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>START HERE carousel</title>
<!-- Self hosted Cormorant Garamond and DM Sans, the two families the Career
     Evidence Starter and the rest of the Capability Formation system use.
     Served over http by build-carousel.mjs so the /fonts/ paths inside
     fonts.css resolve. Text stays live DOM text, never outlines. -->
<link rel="stylesheet" href="/fonts.css">
<style>
  :root {
    --navy: #0F2347;
    --cream: #F5F0E8;
    --gold: #C9A84C;        /* gold on dark */
    --gold-light: #B8952E;  /* gold on cream, the readable value */
    --bright: #F2C44C;      /* bright warm yellow, used once, on navy */
    --rust: #C1440E;
    --pad: 96px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #fff; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }

  .slide {
    position: relative;
    width: 1080px;
    height: 1350px;
    padding: var(--pad);
    background: var(--cream);
    color: var(--navy);
    font-family: 'DM Sans', system-ui, sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    page-break-after: always;
    break-after: page;
  }
  .slide:last-child { page-break-after: auto; break-after: auto; }
  .slide.navy { background: var(--navy); color: var(--cream); }

  .serif { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; }

  .top { flex: 0 0 auto; min-height: 92px; }
  .main { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .foot { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; }

  .kicker {
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 0.24em;
    text-indent: 0.24em;
    text-transform: uppercase;
    color: var(--gold-light);
  }
  .numeral {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 96px;
    line-height: 1;
    color: var(--gold-light);
  }

  h1 { font-size: 86px; line-height: 1.12; letter-spacing: -0.004em; }
  h2 { font-size: 72px; line-height: 1.14; letter-spacing: -0.003em; }
  .slide.navy h1, .slide.navy h2 { color: var(--cream); }
  h2 span { display: block; white-space: nowrap; }

  .rule { width: 96px; height: 3px; background: var(--rust); margin-top: 40px; }
  .slide.navy .rule { background: var(--bright); }

  .body { margin-top: 44px; }
  .body p { font-size: 34px; line-height: 1.5; color: rgb(from var(--navy) r g b / 0.82); }
  .body p + p { margin-top: 22px; }
  .slide.navy .body p { color: rgb(from var(--cream) r g b / 0.86); }

  .supporting {
    margin-top: 40px;
    padding-left: 26px;
    border-left: 4px solid var(--gold-light);
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 40px;
    line-height: 1.3;
  }

  .closing {
    margin-top: 48px;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 44px;
    line-height: 1.3;
    color: var(--bright);
  }

  .footer-line {
    font-weight: 600;
    font-size: 21px;
    letter-spacing: 0.18em;
    text-indent: 0.18em;
    color: rgb(from var(--cream) r g b / 0.80);
  }

  /* navigation: gold ringed counter, bottom right on every slide */
  .counter {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 14px;
    font-weight: 600;
    font-size: 21px;
    letter-spacing: 0.14em;
    color: var(--gold-light);
  }
  .slide.navy .counter { color: var(--gold); }
  .counter .now {
    display: inline-flex; align-items: center; justify-content: center;
    width: 46px; height: 46px; border-radius: 50%;
    border: 2px solid currentColor;
  }
  .counter .of { color: rgb(from var(--navy) r g b / 0.45); }
  .slide.navy .counter .of { color: rgb(from var(--cream) r g b / 0.5); }
  .counter .swipe { font-size: 25px; }

  /* real approved portrait, circular crop, lower right */
  .portrait {
    position: absolute;
    right: 96px;
    bottom: 214px;
    width: 264px;
    height: 264px;
    border-radius: 50%;
    object-fit: cover;
    object-position: 50% 32%;
  }
  .cover .main { max-width: 820px; }
</style>
</head>
<body>
<script type="module">
  const copy = await (await fetch('./copy.json')).json();
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const pad2 = n => String(n).padStart(2, '0');
  const total = copy.slides.length;

  const html = copy.slides.map((s, i) => {
    const top = s.kicker ? `<div class="kicker">${esc(s.kicker)}</div>`
              : s.number ? `<div class="numeral serif">${esc(s.number)}</div>` : '';
    const head = s.headlineLines
      ? `<h2 class="serif">${s.headlineLines.map(l => `<span>${esc(l)}</span>`).join('')}</h2>`
      : `<h${s.mode === 'cover' ? 1 : 2} class="serif">${esc(s.headline)}</h${s.mode === 'cover' ? 1 : 2}>`;
    const body = s.body ? `<div class="body">${s.body.map(p => `<p>${esc(p)}</p>`).join('')}</div>` : '';
    const sup = s.supporting && s.mode !== 'cover'
      ? `<div class="supporting serif">${esc(s.supporting)}</div>` : '';
    const coverSup = s.supporting && s.mode === 'cover'
      ? `<div class="body"><p>${esc(s.supporting)}</p></div>` : '';
    const closing = s.closing ? `<div class="closing serif">${esc(s.closing)}</div>` : '';
    const footer = s.footer ? `<div class="footer-line">${esc(s.footer)}</div>` : '';
    const portrait = s.portrait
      ? `<img class="portrait" src="/images/temidayo-gold-ivory.png" alt="Temidayo Afonja">` : '';

    return `<section class="slide ${s.mode === 'close' ? 'navy' : ''} ${s.mode}">
  ${portrait}
  <div class="top">${top}</div>
  <div class="main">
    ${head}
    <div class="rule"></div>
    ${body}${coverSup}${sup}${closing}
  </div>
  <div class="foot">
    ${footer}
    <div class="counter"><span class="now">${pad2(i + 1)}</span><span class="of">/ ${pad2(total)}</span>${
      i === 0 ? '<span class="swipe">&rarr;</span>' : ''}</div>
  </div>
</section>`;
  }).join('\n');

  document.body.insertAdjacentHTML('afterbegin', html);

  // Headlines are set as large as they fit: inside the slide body, and for a
  // headline supplied as separate lines, without any of those lines wrapping.
  function fit(slide) {
    const h = slide.querySelector('h1, h2');
    const main = slide.querySelector('.main');
    const lines = [...h.querySelectorAll('span')];
    const measure = main.clientWidth;
    const textWidth = el => {
      const r = document.createRange();
      r.selectNodeContents(el);
      return r.getBoundingClientRect().width;
    };
    let size = parseFloat(getComputedStyle(h).fontSize);
    const tooWide = () => lines.length && Math.max(...lines.map(textWidth)) > measure;
    while (size > 40 && (main.scrollHeight > main.clientHeight || tooWide())) {
      size -= 2;
      h.style.fontSize = size + 'px';
    }
  }
  document.querySelectorAll('.slide').forEach(fit);

  await document.fonts.ready;
  await Promise.all([...document.images].map(im => im.complete ? 0 : im.decode().catch(() => 0)));
  // Fit again once the real faces and the portrait are in.
  document.querySelectorAll('.slide').forEach(fit);
  requestAnimationFrame(() => { document.documentElement.dataset.ready = 'true'; });
</script>
</body>
</html>

[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/organizational-diagnostic"
  to = "/organizational-diagnostic.html"
  status = 200

# Canonical route is /organizational-diagnostic. Send the .html form there so a
# single URL accumulates search authority.
[[redirects]]
  from = "/organizational-diagnostic.html"
  to = "/organizational-diagnostic"
  status = 301
  force = true

[[redirects]]
  from = "/ai-capability-readiness"
  to = "/ai-capability-readiness.html"
  status = 200

# principles.html now carries only a pointer to the Framework page, which holds
# the six governing principles. Redirect permanently so old inbound links keep
# working and search authority consolidates on /framework. The file is kept in
# the repository for now so the redirect can be tested; it can be deleted once
# the redirect is confirmed in production. force = true is required while the
# file still exists, because Netlify serves a matching static file ahead of a
# redirect rule unless the rule is forced.
[[redirects]]
  from = "/principles"
  to = "/framework"
  status = 301
  force = true

[[redirects]]
  from = "/principles.html"
  to = "/framework"
  status = 301
  force = true

# Point at the canonical /organizational-diagnostic, not the .html form. Sending
# these at the .html form produced a two-hop chain, because the rule above now
# 301s the .html form onward to the canonical route.
[[redirects]]
  from = "/institutional-diagnostic"
  to = "/organizational-diagnostic"
  status = 301

[[redirects]]
  from = "/institutional-diagnostic.html"
  to = "/organizational-diagnostic"
  status = 301

# Retired 2026-07-29: the in-page org-leader mode moved to /organizational-diagnostic.
# This query-conditioned rule must precede the generic /diagnostic rewrite below.
# Permanent, because the ?audience=org deep link may have been shared outside this
# repo (same reasoning as /audit); a repoint alone would not catch old inbound links.
[[redirects]]
  from = "/diagnostic"
  to = "/organizational-diagnostic"
  status = 301
  force = true
  [redirects.query]
    audience = "org"

[[redirects]]
  from = "/diagnostic"
  to = "/diagnostic.html"
  status = 200

# Permanent. Published essays and emails point at /audit indefinitely; never remove.
[[redirects]]
  from = "/audit"
  to = "/diagnostic"
  status = 301
  force = true

[[redirects]]
  from = "/fieldkit"
  to = "https://temidayoafonja.gumroad.com/l/czmqp"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

# Netlify matches header rules against the requested path, not the file a 200
# rewrite ultimately serves. The canonical route is /diagnostic, so the policy
# has to be declared for both paths or it never applies on the canonical URL.
[[headers]]
  for = "/diagnostic"
  [headers.values]
    Content-Security-Policy = "script-src 'self' 'unsafe-inline' https://formspree.io https://plausible.io"

[[headers]]
  for = "/diagnostic.html"
  [headers.values]
    Content-Security-Policy = "script-src 'self' 'unsafe-inline' https://formspree.io https://plausible.io"

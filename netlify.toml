[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/organizational-diagnostic"
  to = "/organizational-diagnostic.html"
  status = 200

# Canonical route is /organizational-diagnostic. Send the .html form there so a
# single URL accumulates search authority.
[[redirects]]
  from = "/organizational-diagnostic.html"
  to = "/organizational-diagnostic"
  status = 301
  force = true

[[redirects]]
  from = "/ai-capability-readiness"
  to = "/ai-capability-readiness.html"
  status = 200

# The six governing principles live on the Framework page. principles.html was
# deleted in August 2026, so there is no longer a static file to intercept these
# rules and force = true is no longer required. Keep the rules permanently: old
# inbound links still point at /principles, and search authority consolidates on
# /framework.
[[redirects]]
  from = "/principles"
  to = "/framework"
  status = 301

[[redirects]]
  from = "/principles.html"
  to = "/framework"
  status = 301

# Point at the canonical /organizational-diagnostic, not the .html form. Sending
# these at the .html form produced a two-hop chain, because the rule above now
# 301s the .html form onward to the canonical route.
[[redirects]]
  from = "/institutional-diagnostic"
  to = "/organizational-diagnostic"
  status = 301

[[redirects]]
  from = "/institutional-diagnostic.html"
  to = "/organizational-diagnostic"
  status = 301

# Retired 2026-07-29: the in-page org-leader mode moved to /organizational-diagnostic.
# This query-conditioned rule must precede the generic /diagnostic rewrite below.
# Permanent, because the ?audience=org deep link may have been shared outside this
# repo (same reasoning as /audit); a repoint alone would not catch old inbound links.
[[redirects]]
  from = "/diagnostic"
  to = "/organizational-diagnostic"
  status = 301
  force = true
  [redirects.query]
    audience = "org"

[[redirects]]
  from = "/diagnostic"
  to = "/diagnostic.html"
  status = 200

# Permanent. Published essays and emails point at /audit indefinitely; never remove.
[[redirects]]
  from = "/audit"
  to = "/diagnostic"
  status = 301
  force = true

[[redirects]]
  from = "/fieldkit"
  to = "/fieldkit.html"
  status = 200

# dashboard.html is an internal working view. It reads only the operator's own
# browser localStorage and contains no credentials, endpoints, or server calls,
# so nothing was ever exposed by it being reachable. It is nonetheless not a
# public page, so public access is blocked at the edge. The file stays in the
# repository and still works when opened locally for internal use.
[[redirects]]
  from = "/dashboard"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/dashboard.html"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

# Netlify matches header rules against the requested path, not the file a 200
# rewrite ultimately serves. The canonical route is /diagnostic, so the policy
# has to be declared for both paths or it never applies on the canonical URL.
[[headers]]
  for = "/diagnostic"
  [headers.values]
    Content-Security-Policy = "script-src 'self' 'unsafe-inline' https://formspree.io https://plausible.io"

[[headers]]
  for = "/diagnostic.html"
  [headers.values]
    Content-Security-Policy = "script-src 'self' 'unsafe-inline' https://formspree.io https://plausible.io"

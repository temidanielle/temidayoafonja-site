[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/organizational-diagnostic"
  to = "/organizational-diagnostic.html"
  status = 200

[[redirects]]
  from = "/institutional-diagnostic"
  to = "/organizational-diagnostic.html"
  status = 301

[[redirects]]
  from = "/institutional-diagnostic.html"
  to = "/organizational-diagnostic.html"
  status = 301

[[redirects]]
  from = "/diagnostic"
  to = "/diagnostic.html"
  status = 200

# Discreet pilot: clean URL for private sharing of the Executive Capability Portfolio.
[[redirects]]
  from = "/executive-portfolio"
  to = "/executive-portfolio.html"
  status = 200

# Permanent. Published essays and emails point at /audit indefinitely; never remove.
[[redirects]]
  from = "/audit"
  to = "/diagnostic"
  status = 301
  force = true

[[redirects]]
  from = "/fieldkit"
  to = "https://temidayoafonja.gumroad.com/l/czmqp"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/diagnostic.html"
  [headers.values]
    Content-Security-Policy = "script-src 'self' 'unsafe-inline' https://formspree.io https://plausible.io"

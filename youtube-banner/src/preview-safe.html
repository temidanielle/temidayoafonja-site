<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="preview.css">
<style>
  html,body{width:2560px;height:1440px;overflow:hidden;background:#000}
  .sheet{position:absolute;inset:0;background-size:2560px 1440px;background-image:var(--img)}
  .box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);}
  .lbl{position:absolute;font-size:19px;letter-spacing:.16em;text-transform:uppercase;
       font-weight:500;padding:7px 13px;border-radius:3px;white-space:nowrap}
  /* Outside the safe area we dim, so the protected rectangle reads instantly. */
  .veil{position:absolute;background:rgba(4,10,22,.60)}
</style></head>
<body>
  <div class="sheet" id="sheet"></div>

  <div class="veil" style="left:0;top:0;width:2560px;height:508px"></div>
  <div class="veil" style="left:0;top:931px;width:2560px;height:509px"></div>
  <div class="veil" style="left:0;top:508px;width:507px;height:423px"></div>
  <div class="veil" style="left:2053px;top:508px;width:507px;height:423px"></div>

  <div class="box" style="width:2560px;height:1440px;border:3px solid rgba(245,240,232,.35)"></div>
  <div class="box" style="width:2560px;height:423px;border:3px solid rgba(139,160,180,.85)"></div>
  <div class="box" style="width:1855px;height:423px;border:3px dashed rgba(201,168,76,.9)"></div>
  <div class="box" style="width:1546px;height:423px;border:4px solid #C1440E"></div>

  <div class="lbl" style="left:30px;top:26px;color:#F5F0E8;background:rgba(10,22,44,.75)">TV &nbsp;/&nbsp; full bleed &nbsp; 2560 × 1440</div>
  <div class="lbl" style="left:30px;top:452px;color:#8BA0B4;background:rgba(10,22,44,.85)">Desktop max &nbsp; 2560 × 423</div>
  <div class="lbl" style="left:366px;top:952px;color:#C9A84C;background:rgba(10,22,44,.85)">Desktop min &nbsp; 1855 × 423</div>
  <div class="lbl" style="left:520px;top:452px;color:#fff;background:#C1440E">Mobile &nbsp;+&nbsp; text-safe &nbsp; 1546 × 423</div>

  <script src="pick.js"></script>
</body></html>

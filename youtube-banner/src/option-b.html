<!doctype html><html><head><meta charset="utf-8">
<title>Capability Formation: YouTube banner (Option B)</title>
<link rel="stylesheet" href="base.css">
<style>
  /* B: the title recedes to cream and gold lands on the question, so the line
     an individual viewer is meant to answer is the warm one. Keeps the small
     gold diamond that already marks the LinkedIn banner. */
  .title   { font-size:84px; letter-spacing:.155em; text-indent:.155em; color:var(--cream); }
  .diamond { margin:52px 0 48px; }
  .support { font-size:62px; color:var(--gold-light); }
</style></head>
<body>
  <div class="ground"></div><div class="grain"></div>
  <div class="stage">
    <div class="title" id="t">Capability Formation</div>
    <div class="diamond"></div>
    <div class="support" id="s">What is your work building?</div>
  </div>
  <div id="m" style="position:absolute;opacity:0"></div>
  <script src="measure.js"></script>
</body></html>

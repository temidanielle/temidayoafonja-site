<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="preview.css">
<style>
  /* k = 430 / 1546 = .27813 -> the mobile crop scaled to a 430pt phone width */
  html,body{width:900px;height:1240px;overflow:hidden}
  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
        justify-content:center;gap:26px}
  .phone{width:430px;height:932px;background:#fff;border:11px solid #17181c;border-radius:54px;
         overflow:hidden;box-shadow:0 26px 70px rgba(15,35,71,.30);position:relative;flex:none}
  .status{height:46px;display:flex;align-items:flex-end;justify-content:space-between;
          padding:0 26px 6px;font-size:13px;font-weight:600;color:#0f0f0f}
  .appbar{height:44px;display:flex;align-items:center;gap:18px;padding:0 16px}
  .glyph{width:17px;height:2px;background:#0f0f0f;position:relative}
  .glyph::before,.glyph::after{content:'';position:absolute;left:0;width:17px;height:2px;background:#0f0f0f}
  .glyph::before{top:-5px}.glyph::after{top:5px}
  .dot{width:4px;height:4px;border-radius:50%;background:#0f0f0f}
  /* the banner, cropped to the mobile-safe rectangle */
  .banner{width:430px;height:117.6px;background-size:712px 400.5px;background-position:-141px -141.4px}
  .body{padding:14px 16px 0}
  .row{display:flex;align-items:center;gap:14px}
  .avatar{width:78px;height:78px;font-size:0;
          background-image:url('../../temi-photo.jpg');background-size:cover;background-position:50% 22%}
  .name{font-size:21px;font-weight:600;letter-spacing:-.01em}
  .handle{font-size:13.5px;color:#606060;margin-top:3px}
  .desc{font-size:13.5px;color:#606060;margin-top:12px;line-height:1.45}
  .sub{margin-top:16px;padding:9px 0;width:100%;text-align:center;font-size:14.5px}
  .tabs{display:flex;gap:26px;margin-top:20px;border-bottom:1px solid #e5e5e5;padding:0 16px}
  .tab{font-size:14px;color:#606060;padding-bottom:11px}
  .tab.on{color:#0f0f0f;font-weight:600;box-shadow:inset 0 -2.5px 0 #0f0f0f}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
  .thumb{aspect-ratio:16/9;border-radius:9px;background:#e3e6ea}
</style></head>
<body>
  <div class="wrap">
    <div class="cap">Mobile &nbsp;·&nbsp; crops to the 1546 × 423 safe area</div>
    <div class="phone">
      <div class="status"><span>9:41</span><span>▮▮▮</span></div>
      <div class="appbar"><div class="glyph"></div><div style="flex:1"></div>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      <div class="banner crop"></div>
      <div class="body">
        <div class="row">
          <div class="avatar"></div>
          <div><div class="name">Temidayo Afonja</div><div class="handle">@temidayoafonja</div></div>
        </div>
        <div class="desc">Capability that holds when conditions change.</div>
        <div class="sub">Subscribe</div>
      </div>
      <div class="tabs"><div class="tab on">Home</div><div class="tab">Videos</div>
        <div class="tab">Playlists</div><div class="tab">About</div></div>
      <div class="grid"><div class="thumb"></div><div class="thumb"></div>
        <div class="thumb"></div><div class="thumb"></div></div>
    </div>
  </div>
  <script src="pick.js"></script>
</body></html>

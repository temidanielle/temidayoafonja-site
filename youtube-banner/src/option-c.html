<!doctype html><html><head><meta charset="utf-8">
<title>Capability Formation: YouTube banner (Option C)</title>
<link rel="stylesheet" href="base.css">
<style>
  /* C: nothing is centred. A gold vertical hairline anchors the block to the
     left of the safe area, which reads as a masthead rather than a title card.
     No text-indent here: the letter-spaced title must flush left with the
     question beneath it. */
  .stage   { align-items:flex-start; padding-left:78px; }
  .lockup  { display:flex; align-items:center; gap:62px; }
  .stem    { width:2px; height:210px; flex:none;
             background:linear-gradient(180deg,rgba(201,168,76,0) 0%,rgba(201,168,76,.85) 20%,
                        rgba(201,168,76,.85) 80%,rgba(201,168,76,0) 100%); }
  .lines   { display:flex; flex-direction:column; align-items:flex-start; }
  .title   { font-size:80px; letter-spacing:.15em; }
  .support { font-size:58px; margin-top:42px; }
</style></head>
<body>
  <div class="ground"></div><div class="grain"></div>
  <div class="stage">
    <div class="lockup">
      <div class="stem"></div>
      <div class="lines">
        <div class="title" id="t">Capability Formation</div>
        <div class="support" id="s">What is your work building?</div>
      </div>
    </div>
  </div>
  <div id="m" style="position:absolute;opacity:0"></div>
  <script src="measure.js"></script>
</body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
:root{--navy:#0F2347;--cream:#F5F0E8;--gold:#C9A84C;--gold-soft:#EFE4C6;--gold-deep:#756025;--rust-ink:#B6400D;--muted:#5D6676;--line:rgba(15,35,71,.16)}
.card{width:1200px;height:630px;background:var(--cream);display:flex;align-items:center;
  padding:0 74px;gap:56px;font-family:'DM Sans',Arial,sans-serif;position:relative}
.card::after{content:'';position:absolute;left:0;top:0;width:100%;height:8px;background:var(--navy)}
.left{flex:1 1 auto;min-width:0}
.badge{display:inline-block;font-size:15px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold-deep);background:var(--gold-soft);border-bottom:3px solid var(--gold);padding:9px 16px 8px;margin-bottom:26px}
.family{font-size:17px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--rust-ink);margin-bottom:16px}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-size:70px;line-height:1.02;
  color:var(--navy);letter-spacing:-.01em;margin-bottom:22px}
.rule{width:96px;height:4px;background:#C1440E;margin-bottom:22px}
.promise{font-family:'Cormorant Garamond',serif;font-size:23px;line-height:1.35;color:var(--navy);max-width:560px;margin-bottom:26px}
.foot{display:flex;align-items:center;gap:14px;font-size:15px;color:var(--muted)}
.foot b{color:var(--navy);font-weight:500}
.right{flex:0 0 auto;width:300px;position:relative}
.right img{display:block;width:100%;height:auto;border-radius:4px;border:1px solid var(--line);
  box-shadow:0 20px 44px rgba(15,35,71,.20),0 3px 8px rgba(15,35,71,.10)}
</style></head><body>
<div class="card">
  <div class="left">
    <div class="badge">Free Career Accomplishment Tracker</div>
    <div class="family">Keep the Proof</div>
    <h1>The 10-Minute<br>Career Evidence Starter</h1>
    <div class="rule"></div>
    <p class="promise">Turn one accomplishment into proof you can use in a performance review, interview, internal move or career pivot.</p>
    <div class="foot"><b>Temidayo Afonja</b><span>&middot;</span><span>temidayoafonja.com</span></div>
  </div>
  <div class="right"><img src="/career-evidence-starter-cover.png" alt=""></div>
</div>
</body></html>
